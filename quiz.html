<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quiz — WDAI nauka</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/core.js" defer></script>
    <script src="js/data/m1.js" defer></script>
    <script src="js/data/m2.js" defer></script>
    <script src="js/data/m3.js" defer></script>
    <script src="js/data/m4.js" defer></script>
    <script src="js/data/m5.js" defer></script>
    <script src="js/data/m6.js" defer></script>
    <script src="js/data/m7.js" defer></script>
    <script src="js/data/m8.js" defer></script>
    <script src="js/data/l3.js" defer></script>
    <script src="js/pages/quiz.js" defer></script>
  </head>
  <body data-page="quiz">
    <div class="page">
      <header class="site-header" id="site-header"></header>
      <nav class="site-nav" id="site-nav" aria-label="Główna nawigacja"></nav>
      <main class="site-main" id="main">
        <div class="container" style="max-width:820px">
          <h1>Quiz</h1>
          <form class="row card" id="setup" aria-label="Ustawienia quizu">
            <label for="q-mod">Moduł</label>
            <select id="q-mod"></select>
            <label for="q-n">Pytań</label>
            <select id="q-n">
              <option value="5">5</option>
              <option value="10" selected>10</option>
              <option value="20">20</option>
              <option value="999">wszystkie</option>
            </select>
            <button class="btn btn-primary spacer">Start</button>
          </form>
          <div id="quiz" aria-live="polite"></div>
        </div>
      </main>
      <footer class="site-footer">WDAI — nauka · 2026/27</footer>
    </div>
  </body>
</html>
